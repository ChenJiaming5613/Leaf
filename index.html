<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaf — WebGPU glTF PBR Renderer</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05070a; }
      body {
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        color: #e6edf3;
      }
      #leaf-canvas { display: block; width: 100%; height: 100%; }
      #overlay {
        position: fixed; inset: 0;
        display: none; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 0.75rem; padding: 2rem; text-align: center;
        background: #05070a;
      }
      #overlay.visible { display: flex; }
      #overlay h1 { font-size: 2rem; font-weight: 600; letter-spacing: 0.08em; }
      #overlay p { max-width: 36rem; line-height: 1.7; color: #9aa7b4; font-size: 0.95rem; }
      #overlay.error h1 { color: #f87171; }
    </style>
  </head>
  <body>
    <canvas id="leaf-canvas"></canvas>
    <div id="overlay" class="visible">
      <h1>Leaf</h1>
      <p>正在初始化 WebGPU…</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
